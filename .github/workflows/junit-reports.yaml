name: 'E2E Test Report'

on:
  workflow_run:
    workflows: ['CI']                     # runs after CI workflow
    types:
      - completed

# No scopes: the reporter writes the job summary (use-actions-summary), and
# reading this public repository's artifacts needs none.
permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: /e2e-test-reports-(.*)/
          name: JEST Tests $1               # One report per artifact; $1 is the suffix after e2e-test-reports-
          path: 'report*.xml'               # Path to test results (inside artifact .zip)
          reporter: jest-junit              # Format of test results
          fail-on-empty: 'true'
          use-actions-summary: 'true'       # Job summary instead of check runs, so no checks scope
